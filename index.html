<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><meta name="description" content="每次十个单词。支持 Excel 导入、悬停记忆、拼写复习与本地进度保存。"><title>十词 · 单词之间</title><script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="tour.css"><link rel="stylesheet" href="focus.css"><script defer src="vendor/xlsx.full.min.js"></script><script type="module" src="app.js"></script></head>
<body>
<header class="topbar"><div class="nav-wrap"><a class="brand" href="./" aria-label="十词首页">十词</a><span id="compact-progress" aria-live="polite"></span><details class="site-menu"><summary aria-label="打开功能菜单">菜单 <span aria-hidden="true">☰</span></summary><div class="menu-panel"><nav aria-label="主导航"><button data-view="home" class="nav-item">首页</button><button data-view="learn" class="nav-item">学习</button><button data-view="review" class="nav-item">复习</button><button data-view="library" class="nav-item">词库</button></nav><div class="header-actions"><button class="button small outline" id="restart-tour">再次引导</button><label class="theme-control"><span>外观</span><select id="theme-select" aria-label="外观模式"><option value="system">跟随系统</option><option value="light">浅色模式</option><option value="dark">深色模式</option></select></label><button class="button small outline" id="import-top">＋ 导入词库</button></div></div></details></div></header>
<main id="app"><div class="loading">正在准备你的十个单词…</div></main>
<footer><span></span><span id="save-status">进度自动保存在此浏览器</span></footer>
<dialog id="import-dialog" aria-labelledby="import-title"><div class="dialog-head"><div><p class="eyebrow">YOUR WORDS, YOUR PACE</p><h2 id="import-title">带上你的词库。</h2></div><button class="icon-button" id="close-import" aria-label="关闭导入">×</button></div><p class="muted">上传 Excel，选择任意工作表。第一列是单词，第二列是释义。</p><label class="dropzone" id="dropzone" tabindex="0"><input id="file-input" type="file" accept=".xlsx,.xls,.xlsb,.xlsm" hidden><span class="file-icon" aria-hidden="true">↥</span><strong>选择文件，或拖到这里</strong><span class="muted">支持 .xlsx、.xls、.xlsb、.xlsm · 最大 20 MB</span></label><p id="import-error" class="error" role="alert"></p><section id="import-options" hidden><div class="field-grid"><label>工作表<select id="sheet-select"></select></label><label>第二列的释义语言<select id="import-language"><option value="auto">自动识别</option><option value="en">英文释义</option><option value="zh">中文释义</option></select></label></div><label class="checkbox"><input id="has-header" type="checkbox" checked>第一行为表头，不作为单词导入</label><p class="muted" id="import-count"></p><div class="preview-table" id="import-preview"></div><p class="fine">空白单词或空白释义会跳过。相同拼写保留为不同单元格。文件仅在本浏览器读取。</p><button class="button primary full" id="confirm-import">导入并开始学习</button></section></dialog>
